name: اختبارات وبناء

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: اختبارات النواة (١٥٢ اختباراً)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: تنزيل مترجم Kotlin
        run: |
          curl -sSLo kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip
      - name: تشغيل الاختبارات
        env:
          KOTLINC: ${{ github.workspace }}/kotlinc/bin/kotlinc
        run: bash build.sh

  apk:
    name: بناء APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: مفتاح التخزين المؤقت لـ Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: ترجمة APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: midad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
