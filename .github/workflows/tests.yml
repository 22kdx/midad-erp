name: اختبارات وبناء

on:
  push:
    branches: [ main, arena/5570fe9e-midad-erp ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: نشر APK على GitHub Releases بعد نجاح الاختبارات والبناء
        required: false
        default: false
        type: boolean
      release_tag:
        description: وسم الإصدار
        required: false
        default: v1.0.5
        type: string

permissions:
  contents: read

jobs:
  core-tests:
    name: اختبارات النواة (١٦٠ اختباراً)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: تنزيل مترجم Kotlin
        run: |
          curl -sSLo kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip
      - name: تشغيل الاختبارات
        env:
          KOTLINC: ${{ github.workspace }}/kotlinc/bin/kotlinc
        run: bash build.sh

  apk:
    name: بناء APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: التحقق من Android SDK الجاهز على المُشغّل
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
      - name: مفتاح التخزين المؤقت لـ Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: ترجمة APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: midad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: نشر APK في Releases
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [core-tests, apk]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: midad-debug-apk
          path: release-assets
      - name: تجهيز ورفع الإصدار
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$VERSION"
          TAG="${RELEASE_TAG:-v$VERSION}"
          APK="$(find release-assets -maxdepth 2 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APK_NAME="tamm-${VERSION}-debug.apk"
          cp "$APK" "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \\
            --repo "$GITHUB_REPOSITORY" \\
            --target "$GITHUB_SHA" \\
            --title "TAMM $VERSION" \\
            --notes "واجهة TAMM المحسّنة. اجتازت اختبارات النواة وبناء APK على CI."
